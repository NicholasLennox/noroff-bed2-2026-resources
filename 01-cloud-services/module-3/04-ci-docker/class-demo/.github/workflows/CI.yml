# Name of workflow
name: CI

# Trigger
on:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        # Replicating what we do locally to verify
        steps:
            # Checkout pulls the repo code onto the runner (jobs start with an empty machine)
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test