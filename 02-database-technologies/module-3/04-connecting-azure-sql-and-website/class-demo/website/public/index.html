<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Users</h1>

    <div id="message"></div>

    <div class="row g-4">
      <!-- List users, with one search box -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 card-title">Find users</h2>

            <form id="search-form" class="row g-2 mb-3">
              <div class="col-sm-9">
                <input id="search" class="form-control" placeholder="Id, or part of an email - leave empty for all users">
              </div>
              <div class="col-sm-3 d-grid">
                <button type="submit" class="btn btn-primary">Search</button>
              </div>
            </form>

            <table class="table table-striped mb-0">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="users"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Add user -->
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 card-title">Add user</h2>

            <form id="add-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Add user</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="users.js"></script>
</body>
</html>
